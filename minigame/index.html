<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>구공이 츄르 받기</title>
<meta name="description" content="하늘에서 떨어지는 츄르를 받아먹고 물방울·청소기는 피하는 구공이 미니게임.">
<meta name="theme-color" content="#f7e9d0">
<link rel="icon" href="../assets/favicon.png" type="image/png">
<style>
@font-face { font-family: 'Galmuri11'; src: url('../assets/fonts/Galmuri11.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Galmuri11'; src: url('../assets/fonts/Galmuri11-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
:root {
  --cream: #f7e9d0; --paper: #fffaf0; --ink: #33241a; --ink-soft: #6b5540;
  --brown: #7a4f2a; --brown-dark: #5a3720; --orange: #d98b4a; --red: #b1544c; --gold: #e8b45a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #2a2018; color: var(--ink);
  font-family: 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
#app { position: relative; max-width: 480px; height: 100%; margin: 0 auto; background: var(--cream); overflow: hidden; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; font-weight: 700; font-size: 18px; pointer-events: none; }
.hud small { font-size: 12px; color: var(--ink-soft); margin-left: 3px; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px 16px; background: rgba(247, 233, 208, .92); }
.overlay[hidden] { display: none; }
.overlay img { width: 180px; image-rendering: auto; }
h1 { margin: 12px 0 4px; font-size: 28px; color: var(--brown-dark); }
.sub { margin: 0 0 18px; color: var(--ink-soft); font-size: 14px; }
.rules { background: var(--paper); border: 2px solid var(--brown); border-radius: 10px; padding: 10px 14px;
  font-size: 14px; line-height: 1.8; text-align: left; margin-bottom: 18px; box-shadow: 0 3px 0 rgba(90,55,32,.35); }
.btn { font: inherit; font-weight: 700; font-size: 18px; color: #fff; background: var(--orange); border: 2px solid var(--brown-dark);
  border-radius: 10px; padding: 12px 32px; box-shadow: 0 4px 0 var(--brown-dark); cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brown-dark); }
.best { margin-top: 14px; font-size: 13px; color: var(--ink-soft); }
.big { font-size: 44px; font-weight: 700; color: var(--brown-dark); margin: 4px 0; }
.back { margin-top: 16px; font-size: 13px; color: var(--ink-soft); }
.back a { color: var(--brown); }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud"><span id="lives">❤️❤️❤️</span><span><span id="score">0</span><small>냥력</small></span></div>

  <div class="overlay" id="title">
    <img src="../assets/gugoong.png" alt="구공이">
    <h1>구공이 츄르 받기</h1>
    <p class="sub">하늘에서 간식이 내린다. 기준은 고양이.</p>
    <div class="rules">
      🍡 츄르 +10 · 🐟 생선 +20 · ⭐ 황금 츄르 +50<br>
      💧 물방울 · 🧹 청소기 → 목숨 −1<br>
      좌우 누르기 / 드래그 · 키보드 ←/→
    </div>
    <button class="btn" id="start">시작!</button>
    <p class="best" id="best1"></p>
    <p class="back"><a href="../index.html">← 채점소로 돌아가기</a></p>
  </div>

  <div class="overlay" id="over" hidden>
    <img src="../assets/gugoong-right.png" alt="구공이">
    <h1 id="verdict">배부르다</h1>
    <div class="big" id="final">0</div>
    <p class="sub" id="best2"></p>
    <button class="btn" id="again">한 번 더</button>
    <p class="back"><a href="../index.html">← 채점소로 돌아가기</a></p>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const app = document.getElementById('app');
  const $ = id => document.getElementById(id);

  const imgL = new Image(); imgL.src = '../assets/gugoong.png';
  const imgR = new Image(); imgR.src = '../assets/gugoong-right.png';

  const ITEMS = [
    { e: '🍡', pts: 10, w: 50 },
    { e: '🐟', pts: 20, w: 22 },
    { e: '⭐', pts: 50, w: 4 },
    { e: '💧', bad: true, w: 16 },
    { e: '🧹', bad: true, w: 10 },
  ];

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = app.clientWidth; H = app.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  const store = {
    get() { try { return +localStorage.getItem('gugoong-churu-best') || 0; } catch { return 0; } },
    set(v) { try { localStorage.setItem('gugoong-churu-best', v); } catch {} },
  };
  let best = store.get();
  const showBest = () => { $('best1').textContent = best ? `최고 기록 · ${best} 냥력` : '최고 기록 · 아직 없다'; };
  showBest();

  // ── 소리 ──
  let ac = null;
  function beep(freq, dur = .08, type = 'square', vol = .06) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch {}
  }

  // ── 상태 ──
  let cat, items, pops, score, lives, t, spawnT, running, hurtT, combo;
  function reset() {
    cat = { x: W / 2, vx: 0, face: 1 };
    items = []; pops = []; score = 0; lives = 3; t = 0; spawnT = .6; hurtT = 0; combo = 0;
    updateHud();
  }
  function updateHud() {
    $('score').textContent = score;
    $('lives').textContent = '❤️'.repeat(lives) + '🤍'.repeat(3 - lives);
  }

  // ── 입력 ──
  const keys = { l: false, r: false };
  let pointerX = null;
  addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.r = true;
    if ((e.key === 'Enter' || e.key === ' ') && !running) start();
  });
  addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.r = false;
  });
  cv.addEventListener('pointerdown', e => { pointerX = e.clientX - app.getBoundingClientRect().left; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (pointerX !== null) pointerX = e.clientX - app.getBoundingClientRect().left; });
  const up = () => { pointerX = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  // ── 게임 루프 ──
  const groundY = () => H - 48;
  const catW = () => Math.min(W * .32, 150);

  function pick() {
    const total = ITEMS.reduce((s, i) => s + i.w, 0);
    let r = Math.random() * total;
    for (const it of ITEMS) { if ((r -= it.w) < 0) return it; }
    return ITEMS[0];
  }

  function step(dt) {
    t += dt;
    const level = 1 + t / 25;                 // 25초마다 한 단계씩 빨라짐
    // 이동
    const speed = W * 1.1;
    let target = 0;
    if (keys.l) target -= 1;
    if (keys.r) target += 1;
    if (pointerX !== null) {
      const d = pointerX - cat.x;
      target = Math.abs(d) < 6 ? 0 : Math.sign(d) * Math.min(1, Math.abs(d) / 40);
    }
    cat.vx += (target * speed - cat.vx) * Math.min(1, dt * 14);
    cat.x = Math.max(catW() / 2, Math.min(W - catW() / 2, cat.x + cat.vx * dt));
    if (Math.abs(cat.vx) > 20) cat.face = cat.vx > 0 ? 1 : -1;

    // 생성
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnT = Math.max(.28, .9 / level) * (.6 + Math.random() * .8);
      const it = pick();
      items.push({ ...it, x: 24 + Math.random() * (W - 48), y: -30,
        vy: H * (.28 + Math.random() * .12) * level, rot: Math.random() * 6, vr: (Math.random() - .5) * 4 });
    }

    // 낙하 + 충돌
    const gy = groundY();
    const cw = catW(), mouthY = gy - cw * .45;
    for (const it of items) {
      it.y += it.vy * dt; it.rot += it.vr * dt;
      if (!it.done && it.y > mouthY && it.y < gy && Math.abs(it.x - cat.x) < cw * .42) {
        it.done = true;
        if (it.bad) {
          lives--; combo = 0; hurtT = .4; beep(140, .25, 'sawtooth', .08);
          pops.push({ x: it.x, y: mouthY, s: it.e === '💧' ? '으악 물!' : '청소기 싫어!', c: '#b1544c', life: 1 });
          if (navigator.vibrate) navigator.vibrate(80);
        } else {
          combo++;
          const bonus = Math.min(combo - 1, 10);
          const gain = it.pts + bonus;
          score += gain;
          beep(it.pts >= 50 ? 1320 : it.pts >= 20 ? 990 : 760, .09);
          pops.push({ x: it.x, y: mouthY, s: `+${gain}`, c: it.pts >= 50 ? '#c98a1e' : '#5a3720', life: 1 });
        }
        updateHud();
      }
      if (!it.done && it.y > H + 30) { it.done = true; if (!it.bad) combo = 0; }
    }
    items = items.filter(i => !i.done);
    for (const p of pops) { p.y -= 40 * dt; p.life -= dt * 1.2; }
    pops = pops.filter(p => p.life > 0);
    hurtT = Math.max(0, hurtT - dt);

    if (lives <= 0) end();
  }

  function draw() {
    // 하늘
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#f9d9a8'); g.addColorStop(1, '#f7e9d0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 창문 틀 느낌의 배경 선
    ctx.fillStyle = 'rgba(122,79,42,.08)';
    for (let x = (t * 8) % 60 - 60; x < W; x += 60) ctx.fillRect(x, 0, 2, H);
    // 바닥
    const gy = groundY();
    ctx.fillStyle = '#c99a6b'; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = '#7a4f2a'; ctx.fillRect(0, gy, W, 4);

    // 아이템
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '30px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    for (const it of items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(it.rot) * .4);
      if (it.pts >= 50) { ctx.shadowColor = '#ffd36b'; ctx.shadowBlur = 16; }
      ctx.fillText(it.e, 0, 0); ctx.restore();
    }

    // 구공이
    const img = cat.face > 0 ? imgR : imgL;
    const cw = catW(), ch = cw * 243 / 374;
    const bob = Math.abs(cat.vx) > 20 ? Math.sin(t * 18) * 2 : 0;
    ctx.save();
    if (hurtT > 0 && Math.floor(hurtT * 20) % 2) ctx.globalAlpha = .4;
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.ellipse(cat.x, gy + 2, cw * .38, 5, 0, 0, Math.PI * 2); ctx.fill();
    if (img.complete && img.naturalWidth) ctx.drawImage(img, cat.x - cw / 2, gy - ch + 6 + bob, cw, ch);
    ctx.restore();

    // 팝업
    ctx.font = '700 18px Galmuri11, sans-serif';
    for (const p of pops) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.lineWidth = 4; ctx.strokeStyle = '#fffaf0'; ctx.strokeText(p.s, p.x, p.y);
      ctx.fillStyle = p.c; ctx.fillText(p.s, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    if (combo >= 3) {
      ctx.font = '700 15px Galmuri11, sans-serif'; ctx.fillStyle = '#d98b4a';
      ctx.fillText(`${combo} 연속 냠!`, W / 2, 64);
    }
  }

  let last = 0;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
    if (running) step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    $('title').hidden = true; $('over').hidden = true;
    reset(); running = true; beep(660, .1);
  }
  function end() {
    running = false;
    const isBest = score > best;
    if (isBest) { best = score; store.set(best); }
    $('final').textContent = score;
    $('verdict').textContent =
      score >= 1000 ? '츄르의 신 ⭐' : score >= 500 ? '배부른 구공이' : score >= 200 ? '그럭저럭 냠냠' : '아직 배고프다';
    $('best2').textContent = isBest ? '새 최고 기록!' : `최고 기록 · ${best} 냥력`;
    $('over').hidden = false; showBest(); beep(330, .3, 'triangle', .08);
  }

  $('start').onclick = start;
  $('again').onclick = start;
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
