<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>햄찌 씨앗 비행</title>
<meta name="description" content="프로펠러 모자를 쓴 햄스터가 하늘을 날며 해바라기씨를 모으고 보스와 싸우는 미니게임.">
<meta name="theme-color" content="#bfe3f2">
<style>
@font-face { font-family: 'Galmuri11'; src: url('../assets/fonts/Galmuri11.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Galmuri11'; src: url('../assets/fonts/Galmuri11-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
:root { --ink: #3a2a1c; --soft: #6b5540; --paper: #fffaf0; --brown: #7a4f2a; --dark: #5a3720; --orange: #e59a3c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #22303a; color: var(--ink);
  font-family: 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
#app { position: relative; max-width: 480px; height: 100%; margin: 0 auto; overflow: hidden; touch-action: none; background: #bfe3f2; }
canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; font-weight: 700; font-size: 18px; pointer-events: none; }
.hud > :last-child { justify-self: end; }
.hud small { font-size: 12px; color: var(--soft); margin-left: 3px; }
#stagelbl { font-size: 14px; background: rgba(255,250,240,.85); color: var(--dark); border-radius: 999px; padding: 3px 10px; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 24px 16px; background: rgba(255, 246, 228, .9); }
.overlay[hidden] { display: none; }
.overlay canvas { width: 130px; height: 130px; }
h1 { margin: 6px 0 4px; font-size: 28px; color: var(--dark); }
.sub { margin: 0 0 14px; color: var(--soft); font-size: 14px; }
.rules { background: var(--paper); border: 2px solid var(--brown); border-radius: 10px; padding: 10px 14px;
  font-size: 13.5px; line-height: 1.75; text-align: left; margin-bottom: 16px; box-shadow: 0 3px 0 rgba(90,55,32,.35); }
.btn { font: inherit; font-weight: 700; font-size: 18px; color: #fff; background: var(--orange); border: 2px solid var(--dark);
  border-radius: 10px; padding: 12px 32px; box-shadow: 0 4px 0 var(--dark); cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--dark); }
.best { margin-top: 14px; font-size: 13px; color: var(--soft); }
.big { font-size: 44px; font-weight: 700; color: var(--dark); margin: 4px 0; }
.stats { font-size: 14px; color: var(--soft); margin: 0 0 6px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="hud"><span id="lives">❤️❤️❤️</span><span id="stagelbl">1단계</span><span><span id="score">0</span><small>씨앗</small></span></div>

  <div class="overlay" id="title">
    <canvas id="icon1" width="260" height="260"></canvas>
    <h1>햄찌 씨앗 비행</h1>
    <p class="sub">프로펠러 모자 하나로 씨앗 사냥!</p>
    <div class="rules">
      <b>누르고 있으면</b> 위로 붕, 떼면 살살 내려간다<br>
      🌰 해바라기씨 +1 · 🌻 해바라기 +10<br>
      씨앗 20개마다 <b>볼주머니 가득!</b> 보너스 +20<br>
      까마귀 · 먹구름 조심 (목숨 3개)<br>
      <b>2단계부터</b> 배경이 바뀌고 <b>보스</b> 등장!<br>
      보스전에선 씨앗 껍질을 자동으로 <b>퉤퉤</b> 발사
    </div>
    <button class="btn" id="start">날아라!</button>
    <p class="best" id="best1"></p>
  </div>

  <div class="overlay" id="over" hidden>
    <canvas id="icon2" width="260" height="260"></canvas>
    <h1 id="verdict">배부르다</h1>
    <div class="big" id="final">0</div>
    <p class="stats" id="stats"></p>
    <p class="sub" id="best2"></p>
    <button class="btn" id="again">한 번 더</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const app = document.getElementById('app');
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = app.clientWidth; H = app.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const store = {
    get() { try { return +localStorage.getItem('hamster-seed-best') || 0; } catch { return 0; } },
    set(v) { try { localStorage.setItem('hamster-seed-best', v); } catch {} },
  };
  let best = store.get();
  const showBest = () => { $('best1').textContent = best ? `최고 기록 · 씨앗 ${best}개` : '최고 기록 · 아직 없다'; };
  showBest();

  // ── 소리 ──
  let ac = null;
  function beep(freq, dur = .07, type = 'square', vol = .05, slide = 0) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, n);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, n + dur);
      g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(.0001, n + dur);
      o.connect(g).connect(ac.destination); o.start(n); o.stop(n + dur);
    } catch {}
  }

  // ── 단계 테마 ──
  const THEMES = [
    { name: '해바라기 들판', sky: ['#8fcbe6', '#fbe6c3'], orb: 'sun', orbCol: 'rgba(255,240,170,.9)', orbY: .18, cloud: 'rgba(255,255,255,.85)', hill: '#9fd08a', ground: '#7dbb63', stem: '#4f8f3d' },
    { name: '노을 언덕', sky: ['#ef8466', '#fdd59c'], orb: 'sun', orbCol: 'rgba(255,196,120,.95)', orbY: .4, cloud: 'rgba(255,222,206,.8)', hill: '#c98667', ground: '#b5974e', stem: '#7a6a2e' },
    { name: '별밤 숲', sky: ['#1b2350', '#4a4e8c'], orb: 'moon', orbCol: '#f4efd0', orbY: .16, cloud: 'rgba(160,170,215,.32)', hill: '#2c4658', ground: '#2b5a40', stem: '#1f4430', fx: 'stars' },
    { name: '천둥 구름길', sky: ['#55606f', '#a9b4c0'], orb: null, cloud: 'rgba(222,226,234,.7)', hill: '#5f7a6a', ground: '#4e6e55', stem: '#365240', fx: 'rain' },
  ];
  const themeOf = st => THEMES[(st - 1) % THEMES.length];
  const BOSS_INFO = {
    crow:  { name: '대왕 까마귀', hp: 24, r: 46 },
    owl:   { name: '밤 부엉이',   hp: 34, r: 48 },
    storm: { name: '먹구름 대장', hp: 44, r: 56 },
  };
  const bossTypeOf = st => ['crow', 'owl', 'storm'][(st - 2) % 3];
  const STAGE_LEN = 32;

  // ── 그리기: 햄스터 ──
  function drawHamster(c, x, y, s, cheek, spin, tilt, hurt, spit) {
    c.save(); c.translate(x, y); c.rotate(tilt); c.scale(s, s);
    c.fillStyle = '#e8574a';
    c.beginPath(); c.ellipse(0, -27, 11, 6, 0, Math.PI, 0); c.fill();
    c.fillStyle = '#3f6fb5'; c.fillRect(-11, -28, 22, 3);
    c.fillStyle = '#555'; c.fillRect(-1, -38, 2, 9);
    const bw = 18 * Math.abs(Math.cos(spin));
    c.fillStyle = '#f2c94c'; c.beginPath(); c.ellipse(-bw / 2 - 1, -38, bw / 2 + 1, 2.5, 0, 0, TAU); c.fill();
    c.fillStyle = '#4fb06d'; c.beginPath(); c.ellipse(bw / 2 + 1, -38, bw / 2 + 1, 2.5, 0, 0, TAU); c.fill();
    c.fillStyle = '#e6a25f';
    for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * 13, -18, 6, 0, TAU); c.fill(); }
    c.fillStyle = '#f4b8b0';
    for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * 13, -18, 3.2, 0, TAU); c.fill(); }
    c.fillStyle = '#e6a25f'; c.beginPath(); c.ellipse(0, 0, 22, 21, 0, 0, TAU); c.fill();
    c.fillStyle = '#fff4e2'; c.beginPath(); c.ellipse(0, 8, 17, 13, 0, 0, TAU); c.fill();
    const cr = 6 + cheek * 6;
    c.fillStyle = '#fff4e2';
    for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * (12 + cheek * 3), 2, cr, 0, TAU); c.fill(); }
    c.fillStyle = 'rgba(240,130,130,.55)';
    for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * (13 + cheek * 3), 3, 3.2, 0, TAU); c.fill(); }
    c.fillStyle = '#2a1a10';
    if (hurt) {
      c.strokeStyle = '#2a1a10'; c.lineWidth = 1.6;
      for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(sx * 8 - 2.5, -7); c.lineTo(sx * 8 + 2.5, -3); c.moveTo(sx * 8 + 2.5, -7); c.lineTo(sx * 8 - 2.5, -3); c.stroke(); }
    } else {
      for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * 8, -5, 2.6, 0, TAU); c.fill(); }
      c.fillStyle = '#fff';
      for (const sx of [-1, 1]) { c.beginPath(); c.arc(sx * 8 + .9, -6, .9, 0, TAU); c.fill(); }
    }
    c.fillStyle = '#d9787a'; c.beginPath(); c.arc(0, -1, 1.8, 0, TAU); c.fill();
    if (spit) {
      c.fillStyle = '#7a3a2a'; c.beginPath(); c.ellipse(0, 3.5, 2.6, 2.2, 0, 0, TAU); c.fill();
    } else {
      c.strokeStyle = '#7a4f2a'; c.lineWidth = 1;
      c.beginPath(); c.arc(-1.6, 1.5, 1.6, 0, Math.PI); c.arc(1.6, 1.5, 1.6, 0, Math.PI); c.stroke();
    }
    c.fillStyle = '#f4b8b0';
    for (const sx of [-1, 1]) { c.beginPath(); c.ellipse(sx * 5, 12, 3, 2.4, 0, 0, TAU); c.fill(); }
    c.restore();
  }

  function drawSeed(c, x, y, s, rot) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
    c.fillStyle = '#2b2622';
    c.beginPath(); c.moveTo(0, -8); c.quadraticCurveTo(6, -2, 0, 8); c.quadraticCurveTo(-6, -2, 0, -8); c.fill();
    c.strokeStyle = '#e9e2d4'; c.lineWidth = 1.1;
    for (const sx of [-2, 0, 2]) { c.beginPath(); c.moveTo(sx * .8, -5); c.lineTo(sx, 5); c.stroke(); }
    c.restore();
  }

  function drawShell(c, x, y, s, rot) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
    c.fillStyle = '#d8c7a8';
    c.beginPath(); c.ellipse(-2, 0, 6, 3, .3, 0, TAU); c.fill();
    c.fillStyle = '#4a3d33';
    c.beginPath(); c.ellipse(3, 1, 5, 2.6, -.3, 0, TAU); c.fill();
    c.restore();
  }

  function drawFlower(c, x, y, s, rot) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
    c.fillStyle = '#f6c431';
    for (let i = 0; i < 12; i++) { c.save(); c.rotate(i * TAU / 12); c.beginPath(); c.ellipse(0, -11, 3.5, 7, 0, 0, TAU); c.fill(); c.restore(); }
    c.fillStyle = '#6b3f1e'; c.beginPath(); c.arc(0, 0, 7, 0, TAU); c.fill();
    c.fillStyle = '#3e2410';
    for (let i = 0; i < 8; i++) { const a = i * 2.4; c.beginPath(); c.arc(Math.cos(a) * 3.5, Math.sin(a) * 3.5, 1, 0, TAU); c.fill(); }
    c.restore();
  }

  function drawCrown(c, x, y, s) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = '#f2c94c'; c.strokeStyle = '#a5761c'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(-8, 4); c.lineTo(-9, -5); c.lineTo(-4, -1); c.lineTo(0, -7); c.lineTo(4, -1); c.lineTo(9, -5); c.lineTo(8, 4); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#e8574a'; c.beginPath(); c.arc(0, 1, 1.6, 0, TAU); c.fill();
    c.restore();
  }

  function drawCrow(c, x, y, s, flap) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = '#2d2a33';
    c.beginPath(); c.ellipse(0, 0, 14, 9, 0, 0, TAU); c.fill();
    c.beginPath(); c.arc(-12, -4, 7, 0, TAU); c.fill();
    c.beginPath(); c.moveTo(10, -2); c.lineTo(22, -6); c.lineTo(20, 4); c.fill();
    const wy = Math.sin(flap) * 12;
    c.fillStyle = '#3c3845';
    c.beginPath(); c.moveTo(-4, -2); c.quadraticCurveTo(4, -10 - wy, 12, -4 - wy); c.lineTo(6, 2); c.fill();
    c.fillStyle = '#f0a83a';
    c.beginPath(); c.moveTo(-18, -5); c.lineTo(-25, -3); c.lineTo(-18, -1); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-13, -6, 2, 0, TAU); c.fill();
    c.fillStyle = '#000'; c.beginPath(); c.arc(-13.5, -6, 1, 0, TAU); c.fill();
    c.restore();
  }

  function drawOwl(c, x, y, s, t, blink) {
    c.save(); c.translate(x, y); c.scale(s, s);
    const flap = Math.sin(t * 6) * 6;
    c.fillStyle = '#5e4630';                                   // 날개
    for (const sx of [-1, 1]) { c.beginPath(); c.ellipse(sx * 17, 4 + flap * sx * .3, 7, 15, sx * (.4 + flap * .02), 0, TAU); c.fill(); }
    c.fillStyle = '#7a5a3a'; c.beginPath(); c.ellipse(0, 2, 17, 21, 0, 0, TAU); c.fill();
    c.fillStyle = '#7a5a3a';                                   // 귀깃
    for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(sx * 6, -16); c.lineTo(sx * 15, -26); c.lineTo(sx * 15, -12); c.fill(); }
    c.fillStyle = '#d9c29a'; c.beginPath(); c.ellipse(0, 9, 11, 12, 0, 0, TAU); c.fill();
    c.strokeStyle = '#b89c70'; c.lineWidth = 1;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(-3 + i * 3, 6 + (i % 2) * 5, 2, 0, Math.PI); c.stroke(); }
    for (const sx of [-1, 1]) {                                // 눈
      c.fillStyle = '#fff4d6'; c.beginPath(); c.arc(sx * 7, -6, 7, 0, TAU); c.fill();
      if (blink) { c.strokeStyle = '#2a1a10'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(sx * 7 - 5, -6); c.lineTo(sx * 7 + 5, -6); c.stroke(); }
      else {
        c.fillStyle = '#f2c94c'; c.beginPath(); c.arc(sx * 7, -6, 4.6, 0, TAU); c.fill();
        c.fillStyle = '#1a120c'; c.beginPath(); c.arc(sx * 7 - 1, -6, 2.6, 0, TAU); c.fill();
      }
    }
    c.strokeStyle = '#3a2a1c'; c.lineWidth = 1.8;               // 화난 눈썹
    for (const sx of [-1, 1]) { c.beginPath(); c.moveTo(sx * 2, -12); c.lineTo(sx * 12, -15); c.stroke(); }
    c.fillStyle = '#f0a83a'; c.beginPath(); c.moveTo(-2.5, -2); c.lineTo(2.5, -2); c.lineTo(0, 3); c.fill();
    c.restore();
  }

  function drawStorm(c, x, y, s, t, boss) {
    c.save(); c.translate(x, y); c.scale(s, s);
    const flash = Math.sin(t * 9 + x) > .85;
    c.fillStyle = flash ? '#8d8a9c' : '#6e6b7c';
    for (const [cx, cy, r] of [[-16, 2, 12], [0, -6, 16], [17, 1, 12], [6, 6, 11], [-6, 6, 11]]) { c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.fill(); }
    c.fillStyle = flash ? '#fff7a8' : '#f2d64b';
    c.beginPath(); c.moveTo(-2, 12); c.lineTo(6, 12); c.lineTo(1, 22); c.lineTo(7, 22); c.lineTo(-4, 36); c.lineTo(-1, 25); c.lineTo(-6, 25); c.closePath(); c.fill();
    c.fillStyle = '#2a2a33';
    c.beginPath(); c.arc(-6, -2, 1.8, 0, TAU); c.arc(6, -2, 1.8, 0, TAU); c.fill();
    c.strokeStyle = '#2a2a33'; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(-4, 5); c.quadraticCurveTo(0, 2, 4, 5); c.stroke();
    if (boss) { c.beginPath(); c.moveTo(-10, -7); c.lineTo(-3, -4); c.moveTo(10, -7); c.lineTo(3, -4); c.stroke(); }
    c.restore();
  }

  function drawIcon(id, cheek) {
    const c = $(id).getContext('2d'); c.clearRect(0, 0, 260, 260);
    drawHamster(c, 130, 150, 3.7, cheek, .6, 0, false, false);
  }
  drawIcon('icon1', .2);

  // ── 상태 ──
  const S = () => Math.min(W, H * .62) / 360;
  let ham, things, pops, clouds, hills, stars, rain, seeds, flowers, lives, dist, t, spawnT, running, hurtT, pouch, holding, speed, pouchFlash;
  let stage, stageT, phase, clearT, boss, bossKills, shells, bullets, shotT, banner, prevTheme, themeFade, shake;

  function reset() {
    ham = { x: W * .27, y: H * .45, vy: 0, spin: 0, spit: 0 };
    things = []; pops = []; shells = []; bullets = []; seeds = 0; flowers = 0; lives = 3; dist = 0; t = 0;
    spawnT = 1; hurtT = 0; pouch = 0; holding = false; pouchFlash = 0;
    stage = 1; stageT = 0; phase = 'fly'; clearT = 0; boss = null; bossKills = 0; shotT = 0; shake = 0;
    prevTheme = null; themeFade = 1; banner = null;
    clouds = Array.from({ length: 6 }, () => ({ x: Math.random() * W, y: Math.random() * H * .6, r: 18 + Math.random() * 22, k: .2 + Math.random() * .3 }));
    hills = Array.from({ length: 5 }, (_, i) => ({ x: i * W * .35, r: W * (.25 + Math.random() * .15) }));
    stars = Array.from({ length: 50 }, () => ({ x: Math.random(), y: Math.random() * .7, p: Math.random() * TAU }));
    rain = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H }));
    updateHud();
  }
  function updateHud() {
    $('score').textContent = seeds;
    $('lives').textContent = '❤️'.repeat(Math.max(0, lives)) + '🤍'.repeat(3 - Math.max(0, lives));
    $('stagelbl').textContent = phase === 'boss' ? `${stage}단계 · 보스` : `${stage}단계`;
  }
  function showBanner(txt, sub, col = '#5a3720') { banner = { txt, sub, col, life: 2.4 }; }

  // ── 입력 ──
  const press = v => { holding = v; };
  addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') { e.preventDefault(); if (running) press(true); else if (!e.repeat) start(); }
  });
  addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') press(false); });
  cv.addEventListener('pointerdown', e => { press(true); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', () => press(false));
  cv.addEventListener('pointercancel', () => press(false));

  // ── 배치 패턴 ──
  const groundH = () => H * .1;
  const playTop = () => 105, playBot = () => H - groundH() - 40;
  function spawnPattern() {
    const s = S(), top = playTop(), bot = playBot();
    const x0 = W + 30, level = Math.min((stage - 1) / 3 + stageT / 90, 1);
    const cy = top + Math.random() * (bot - top);
    // 보스전에는 씨앗만 조금씩
    if (phase !== 'fly') {
      for (let i = 0; i < 5; i++) things.push({ kind: 'seed', x: x0 + i * 28 * s, y: cy });
      spawnT = 2.2 + Math.random();
      return;
    }
    const r = Math.random();
    if (r < .3) {
      for (let i = 0; i < 6; i++) things.push({ kind: 'seed', x: x0 + i * 30 * s, y: cy });
    } else if (r < .55) {
      for (let i = 0; i < 9; i++) things.push({ kind: 'seed', x: x0 + i * 28 * s, y: clamp(cy + Math.sin(i * .7) * 50 * s, top, bot) });
    } else if (r < .7) {
      things.push({ kind: 'flower', x: x0 + 40 * s, y: cy });
      for (let i = 0; i < 8; i++) { const a = i * TAU / 8; things.push({ kind: 'seed', x: x0 + 40 * s + Math.cos(a) * 42 * s, y: cy + Math.sin(a) * 42 * s }); }
    } else if (r < .7 + .18 + level * .1) {
      const crowY = Math.random() < .6 ? ham.y : cy;
      things.push({ kind: 'crow', x: x0, y: crowY, base: crowY, ph: Math.random() * TAU, vx: 60 + level * 60 });
      const sy = crowY < (top + bot) / 2 ? crowY + 70 * s : crowY - 70 * s;
      for (let i = 0; i < 4; i++) things.push({ kind: 'seed', x: x0 + i * 26 * s, y: sy });
    } else {
      const y = Math.random() < .5 ? top + 30 : bot - 10;
      things.push({ kind: 'storm', x: x0 + 20, y });
      for (let i = 0; i < 5; i++) things.push({ kind: 'seed', x: x0 + i * 28 * s, y: (top + bot) / 2 + (y < (top + bot) / 2 ? 40 : -40) });
    }
    spawnT = (1.1 + Math.random() * .7) / (1 + level * .6);
  }

  // ── 단계·보스 ──
  function nextStage() {
    prevTheme = themeOf(stage); stage++; themeFade = 0;
    phase = 'fly'; stageT = 0; boss = null; bullets = []; shells = [];
    if (lives < 3) { lives++; pops.push({ x: ham.x, y: ham.y - 46 * S(), txt: '목숨 +1', col: '#d9534f', life: 1.4 }); }
    showBanner(`${stage}단계`, themeOf(stage).name);
    beep(523, .12, 'square', .05); setTimeout(() => beep(784, .16, 'square', .05), 130);
    updateHud();
  }
  function startBoss() {
    const type = bossTypeOf(stage), info = BOSS_INFO[type], loop = Math.floor((stage - 2) / 3);
    const hp = Math.round(info.hp * (1 + loop * .5));
    boss = { type, name: info.name, hp, max: hp, r: info.r, x: W + 120, y: H * .45, t: 0, cd: 1.6, n: 0, hit: 0, loop };
    phase = 'boss'; shotT = .6;
    showBanner('⚠ 보스 등장!', info.name, '#b1544c');
    beep(200, .4, 'sawtooth', .06, 1.6);
    updateHud();
  }
  function hurt(msg, kb) {
    if (hurtT > 0) return;
    const s = S();
    lives--; hurtT = 1.4; ham.vy = kb * s; shake = .3;
    pops.push({ x: ham.x, y: ham.y - 40 * s, txt: msg, col: '#b1544c', life: 1.2 });
    beep(160, .3, 'sawtooth', .07, .5);
    if (navigator.vibrate) navigator.vibrate(90);
    updateHud();
  }
  function aimAt(x, y, spd) { const a = Math.atan2(ham.y - y, ham.x - x); return [Math.cos(a) * spd, Math.sin(a) * spd, a]; }

  function updateBoss(dt) {
    const s = S(), b = boss;
    b.t += dt; b.hit = Math.max(0, b.hit - dt);
    const tx = W * .78;
    b.x += (tx - b.x) * Math.min(1, dt * 2);
    const mid = (playTop() + playBot()) / 2, amp = (playBot() - playTop()) / 2 - 20 * s;
    const sp = b.type === 'crow' ? .9 : b.type === 'owl' ? .6 : .5;
    b.y = mid + Math.sin(b.t * sp * (1 + b.loop * .2)) * amp * (b.type === 'owl' ? .8 : 1);
    if (b.x > W - 10) return;   // 등장 중엔 공격 안 함
    b.cd -= dt * (1 + b.loop * .25);
    if (b.cd > 0) return;
    b.n++;
    if (b.type === 'crow') {
      const spd = 240 * s;
      const angs = b.n % 3 === 0 ? [-.25, 0, .25] : [0];
      const [, , a] = aimAt(b.x - 30 * s, b.y, spd);
      for (const d of angs) bullets.push({ kind: 'feather', x: b.x - 30 * s, y: b.y, vx: Math.cos(a + d) * spd, vy: Math.sin(a + d) * spd, r: 7 * s });
      b.cd = 1.3; beep(500, .05, 'triangle', .04, .7);
    } else if (b.type === 'owl') {
      const spd = 165 * s, [, , a] = aimAt(b.x, b.y, spd);
      for (let i = -2; i <= 2; i++) bullets.push({ kind: 'star', x: b.x - 20 * s, y: b.y, vx: Math.cos(a + i * .22) * spd, vy: Math.sin(a + i * .22) * spd, r: 7 * s, rot: 0 });
      b.cd = 1.7; beep(700, .08, 'sine', .05, 1.4);
    } else {
      if (b.n % 2) {
        bullets.push({ kind: 'beam', y: ham.y, warn: .9, live: .35 });
        b.cd = 1.6; beep(300, .15, 'square', .03);
      } else {
        for (let i = 0; i < 4; i++) {
          const [vx, vy] = aimAt(b.x, b.y, (200 + i * 25) * s);
          bullets.push({ kind: 'drop', x: b.x - 20 * s, y: b.y + (i - 1.5) * 22 * s, vx, vy, r: 7 * s });
        }
        b.cd = 1.4; beep(420, .06, 'triangle', .04, .6);
      }
    }
  }

  // ── 진행 ──
  function step(dt) {
    t += dt; stageT += dt;
    const s = S();
    themeFade = Math.min(1, themeFade + dt / 1.6);
    speed = Math.min(160 + (stage - 1) * 22 + Math.min(stageT, 30), 320) * s * (phase === 'boss' ? .6 : 1);
    dist += speed * dt;

    // 비행 물리
    const g = 820 * s, lift = 1650 * s;
    ham.vy += (holding ? -lift + g * .25 : g) * dt * .55;
    ham.vy = clamp(ham.vy, -330 * s, 330 * s);
    ham.y += ham.vy * dt;
    const top = 95, bot = H - groundH() - 24 * s;
    if (ham.y < top) { ham.y = top; ham.vy = Math.max(0, ham.vy); }
    if (ham.y > bot) { ham.y = bot; ham.vy = Math.min(0, ham.vy); }
    ham.spin += dt * (holding ? 40 : 14);
    ham.spit = Math.max(0, ham.spit - dt);
    if (holding && Math.random() < dt * 8) beep(220 + Math.random() * 40, .03, 'triangle', .012);

    // 배경
    for (const c of clouds) { c.x -= speed * c.k * dt; if (c.x < -80) { c.x = W + 80; c.y = Math.random() * H * .6; } }
    for (const h of hills) { h.x -= speed * .4 * dt; if (h.x < -h.r * 1.2) { h.x += hills.length * W * .35; h.r = W * (.25 + Math.random() * .15); } }
    for (const r of rain) { r.y += 520 * dt; r.x -= (120 + speed * .3) * dt; if (r.y > H) { r.y = -10; r.x = Math.random() * (W + 100); } }

    // 단계 흐름
    if (phase === 'fly' && stageT >= STAGE_LEN) { stage === 1 ? nextStage() : startBoss(); }
    if (phase === 'clear') { clearT -= dt; if (clearT <= 0) nextStage(); }

    spawnT -= dt; if (spawnT <= 0) spawnPattern();

    // 물건
    const hr = 22 * s;
    for (const o of things) {
      o.x -= speed * dt;
      if (o.kind === 'crow') { o.x -= o.vx * s * dt; o.ph += dt * 3; o.y = o.base + Math.sin(o.ph) * 25 * s; }
      if (o.kind === 'seed' && pouchFlash > 0) {
        const dx = ham.x - o.x, dy = ham.y - o.y, d = Math.hypot(dx, dy);
        if (d < 140 * s) { o.x += dx / d * 400 * s * dt; o.y += dy / d * 400 * s * dt; }
      }
      const dx = o.x - ham.x, dy = o.y - ham.y, d = Math.hypot(dx, dy);
      if (o.dead) continue;
      if (o.kind === 'seed' && d < hr + 8 * s) {
        o.dead = true; seeds++; pouch++; beep(880 + (pouch % 5) * 80, .05);
        if (pouch >= 20) {
          pouch = 0; seeds += 20; pouchFlash = 3;
          pops.push({ x: ham.x, y: ham.y - 50 * s, txt: '볼주머니 가득! +20', col: '#d96a1e', life: 1.6 });
          beep(660, .12, 'square', .06, 2);
        }
        updateHud();
      } else if (o.kind === 'flower' && d < hr + 16 * s) {
        o.dead = true; seeds += 10; flowers++; updateHud();
        pops.push({ x: o.x, y: o.y - 20, txt: '+10', col: '#c98a1e', life: 1 });
        beep(990, .1, 'square', .06, 1.5);
      } else if (o.kind === 'crow' && d < hr + 12 * s && hurtT <= 0) {
        o.dead = true; seeds -= Math.min(seeds, 5); hurt('까악! 씨앗 뺏겼다', -180);
      } else if (o.kind === 'storm' && Math.hypot(dx, dy + 8 * s) < hr + 28 * s) {
        hurt('찌릿!', 220);
      }
    }
    things = things.filter(o => !o.dead && o.x > -80);

    // 보스전
    if (boss && phase === 'boss') {
      updateBoss(dt);
      shotT -= dt;
      if (shotT <= 0 && boss.x < W - 10) {
        shells.push({ x: ham.x + 22 * s, y: ham.y + 3 * s, rot: 0 });
        ham.spit = .12; shotT = .24;
        if (Math.random() < .35) beep(1200, .025, 'square', .015);
      }
      if (Math.hypot(boss.x - ham.x, boss.y - ham.y) < boss.r * s + hr * .7) hurt('으앗 부딪혔다!', 200);
    }
    for (const sh of shells) {
      sh.x += 520 * s * dt; sh.rot += dt * 14;
      if (boss && phase === 'boss' && !sh.dead && Math.hypot(sh.x - boss.x, sh.y - boss.y) < boss.r * s) {
        sh.dead = true; boss.hp--; boss.hit = .08;
        if (boss.hp <= 0) defeatBoss();
      }
    }
    shells = shells.filter(sh => !sh.dead && sh.x < W + 20);

    for (const b of bullets) {
      if (b.kind === 'beam') {
        if (b.warn > 0) { b.warn -= dt; if (b.warn <= 0) { shake = .2; beep(90, .3, 'sawtooth', .07, .5); } }
        else { b.live -= dt; if (Math.abs(ham.y - b.y) < 20 * s) hurt('지지직!', 0); if (b.live <= 0) b.dead = true; }
        continue;
      }
      b.x += b.vx * dt; b.y += b.vy * dt; if (b.rot !== undefined) b.rot += dt * 5;
      if (Math.hypot(b.x - ham.x, b.y - ham.y) < b.r + hr * .65) { b.dead = true; hurt(b.kind === 'star' ? '별똥 맞았다!' : b.kind === 'drop' ? '차가워!' : '깃털 공격!', 0); }
      if (b.x < -30 || b.y < -30 || b.y > H + 30 || b.x > W + 30) b.dead = true;
    }
    bullets = bullets.filter(b => !b.dead);

    for (const p of pops) { p.y -= 30 * dt; p.life -= dt; }
    pops = pops.filter(p => p.life > 0);
    if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
    hurtT = Math.max(0, hurtT - dt);
    pouchFlash = Math.max(0, pouchFlash - dt);
    shake = Math.max(0, shake - dt);

    if (lives <= 0) end();
  }

  function defeatBoss() {
    const s = S(), bonus = 50 * (stage - 1);
    seeds += bonus; bossKills++;
    for (let i = 0; i < 14; i++) {
      const a = i * TAU / 14;
      things.push({ kind: 'seed', x: boss.x + Math.cos(a) * 30 * s, y: boss.y + Math.sin(a) * 30 * s });
    }
    pops.push({ x: boss.x, y: boss.y - 60 * s, txt: `격파! +${bonus}`, col: '#d96a1e', life: 1.8 });
    showBanner('보스 격파!', `${boss.name} 퇴치 🎉`, '#d96a1e');
    boss = null; bullets = []; phase = 'clear'; clearT = 2.6; shake = .3;
    [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, .14, 'square', .06), i * 120));
    updateHud();
  }

  // ── 그리기 ──
  function drawBg(th, alpha) {
    const s = S(), gy = H - groundH();
    ctx.save(); ctx.globalAlpha = alpha;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, th.sky[0]); sky.addColorStop(1, th.sky[1]);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    if (th.fx === 'stars') {
      for (const st of stars) {
        ctx.fillStyle = `rgba(255,250,220,${.4 + .5 * Math.sin(t * 2 + st.p) ** 2})`;
        ctx.fillRect(st.x * W, st.y * H, 2, 2);
      }
    }
    if (th.orb) {
      ctx.fillStyle = th.orbCol;
      ctx.beginPath(); ctx.arc(W * .82, H * th.orbY, (th.orb === 'moon' ? 26 : th.orbY > .3 ? 46 : 34) * s, 0, TAU); ctx.fill();
      if (th.orb === 'moon') {
        ctx.fillStyle = 'rgba(180,170,140,.35)';
        ctx.beginPath(); ctx.arc(W * .82 - 8 * s, H * th.orbY - 5 * s, 5 * s, 0, TAU); ctx.arc(W * .82 + 7 * s, H * th.orbY + 7 * s, 3.5 * s, 0, TAU); ctx.fill();
      }
    }
    ctx.fillStyle = th.cloud;
    for (const c of clouds) {
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.arc(c.x + c.r, c.y + 4, c.r * .8, 0, TAU); ctx.arc(c.x - c.r, c.y + 6, c.r * .7, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = th.hill;
    for (const h of hills) { ctx.beginPath(); ctx.ellipse(h.x, gy, h.r, h.r * .45, 0, Math.PI, 0); ctx.fill(); }
    ctx.fillStyle = th.ground; ctx.fillRect(0, gy, W, H - gy);
    const off = (dist * .9) % (46 * s);
    for (let x = -off; x < W + 40; x += 46 * s) {
      ctx.strokeStyle = th.stem; ctx.lineWidth = 2 * s;
      ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x, gy + 6 * s); ctx.stroke();
      drawFlower(ctx, x, gy + 4 * s, .55 * s, 0);
    }
    if (th.fx === 'stars') { ctx.fillStyle = 'rgba(20,24,60,.28)'; ctx.fillRect(0, gy, W, H - gy); }
    if (th.fx === 'rain') {
      ctx.strokeStyle = 'rgba(230,240,255,.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (const r of rain) { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 4, r.y + 12); }
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw() {
    const s = S();
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 8 * shake / .3, (Math.random() - .5) * 8 * shake / .3);
    if (prevTheme && themeFade < 1) drawBg(prevTheme, 1);
    drawBg(themeOf(stage || 1), prevTheme ? themeFade : 1);

    for (const o of things) {
      if (o.kind === 'seed') drawSeed(ctx, o.x, o.y + Math.sin(t * 4 + o.x * .05) * 2, 1.6 * s, .4);
      else if (o.kind === 'flower') drawFlower(ctx, o.x, o.y, 1.3 * s, t * 1.5);
      else if (o.kind === 'crow') drawCrow(ctx, o.x, o.y, 1.3 * s, o.ph * 4);
      else if (o.kind === 'storm') drawStorm(ctx, o.x, o.y, 1.4 * s, t, false);
    }

    // 번개 빔
    for (const b of bullets) {
      if (b.kind !== 'beam') continue;
      if (b.warn > 0) {
        ctx.fillStyle = `rgba(255,90,70,${.15 + .2 * (Math.sin(t * 30) > 0)})`;
        ctx.fillRect(0, b.y - 18 * s, W, 36 * s);
        ctx.strokeStyle = 'rgba(255,90,70,.8)'; ctx.setLineDash([8, 6]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, b.y); ctx.lineTo(W, b.y); ctx.stroke(); ctx.setLineDash([]);
      } else {
        ctx.fillStyle = 'rgba(255,247,168,.9)'; ctx.fillRect(0, b.y - 14 * s, W, 28 * s);
        ctx.fillStyle = '#fff'; ctx.fillRect(0, b.y - 5 * s, W, 10 * s);
      }
    }

    // 보스
    if (boss) {
      ctx.save();
      if (boss.hit > 0) ctx.globalAlpha = .55;
      if (boss.type === 'crow') {
        drawCrow(ctx, boss.x, boss.y, 3.2 * s, boss.t * 9);
        drawCrown(ctx, boss.x - 38 * s, boss.y - 38 * s, 1.6 * s);
      } else if (boss.type === 'owl') {
        drawOwl(ctx, boss.x, boss.y, 2.3 * s, boss.t, Math.sin(boss.t * 1.3) > .97);
      } else {
        drawStorm(ctx, boss.x, boss.y, 3 * s, t, true);
        drawCrown(ctx, boss.x, boss.y - 62 * s, 1.8 * s);
      }
      ctx.restore();
    }

    // 껍질 · 보스 탄환
    for (const sh of shells) drawShell(ctx, sh.x, sh.y, 1.5 * s, sh.rot);
    for (const b of bullets) {
      if (b.kind === 'feather') {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
        ctx.fillStyle = '#2d2a33'; ctx.beginPath(); ctx.ellipse(0, 0, 11 * s, 4 * s, 0, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#6a6577'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-11 * s, 0); ctx.lineTo(11 * s, 0); ctx.stroke();
        ctx.restore();
      } else if (b.kind === 'star') {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
        ctx.fillStyle = '#ffd86b'; ctx.beginPath();
        for (let i = 0; i < 10; i++) { const r = (i % 2 ? 4 : 9) * s, a = i * TAU / 10; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
        ctx.fill(); ctx.restore();
      } else if (b.kind === 'drop') {
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
        ctx.fillStyle = '#6fb6e8'; ctx.beginPath(); ctx.moveTo(0, -10 * s); ctx.quadraticCurveTo(8 * s, 4 * s, 0, 8 * s); ctx.quadraticCurveTo(-8 * s, 4 * s, 0, -10 * s); ctx.fill();
        ctx.restore();
      }
    }

    // 햄스터
    if (ham) {
      ctx.save();
      if (hurtT > 0 && Math.floor(hurtT * 12) % 2) ctx.globalAlpha = .45;
      if (pouchFlash > 0) {
        ctx.fillStyle = `rgba(255,214,90,${.25 + .15 * Math.sin(t * 12)})`;
        ctx.beginPath(); ctx.arc(ham.x, ham.y, 40 * s, 0, TAU); ctx.fill();
      }
      drawHamster(ctx, ham.x, ham.y, 1.15 * s, pouch / 20, ham.spin, clamp(ham.vy / (900 * s), -.35, .35), hurtT > .9, ham.spit > 0);
      ctx.restore();
    }
    ctx.restore();

    const night = themeOf(stage || 1).fx === 'stars';
    if (running) {
      // 볼주머니 게이지
      const bw = 120 * s, bx = W / 2 - bw / 2, by = 52;
      ctx.fillStyle = 'rgba(255,250,240,.85)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
      ctx.fillStyle = '#e59a3c'; ctx.fillRect(bx, by, bw * pouch / 20, 8);
      ctx.font = '700 11px Galmuri11, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = night ? '#f4efd0' : '#6b5540'; ctx.fillText('볼주머니', W / 2, by + 13);
      // 보스 체력
      if (boss) {
        const hw = W * .62, hx = W / 2 - hw / 2, hy = 84;
        ctx.fillStyle = 'rgba(40,30,30,.55)'; ctx.fillRect(hx - 2, hy - 2, hw + 4, 12);
        ctx.fillStyle = '#d9534f'; ctx.fillRect(hx, hy, hw * Math.max(0, boss.hp) / boss.max, 8);
        ctx.font = '700 12px Galmuri11, sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,250,240,.9)';
        ctx.strokeText(boss.name, W / 2, hy + 13); ctx.fillStyle = '#7a2a24'; ctx.fillText(boss.name, W / 2, hy + 13);
      }
    }

    // 팝업
    ctx.font = '700 16px Galmuri11, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of pops) {
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.lineWidth = 4; ctx.strokeStyle = '#fffaf0'; ctx.strokeText(p.txt, p.x, p.y);
      ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    // 단계 배너
    if (banner && running) {
      const a = Math.min(1, banner.life * 2, (2.4 - banner.life) * 4);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(255,250,240,.88)';
      const by = H * .3;
      ctx.fillRect(0, by - 38, W, 76);
      ctx.font = '700 28px Galmuri11, sans-serif'; ctx.fillStyle = banner.col; ctx.fillText(banner.txt, W / 2, by - 10);
      ctx.font = '700 15px Galmuri11, sans-serif'; ctx.fillStyle = '#6b5540'; ctx.fillText(banner.sub, W / 2, by + 20);
      ctx.globalAlpha = 1;
    }
  }

  let last = 0;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
    if (running) step(dt);
    else if (ham) { ham.spin += dt * 10; t += dt; }
    draw();
    requestAnimationFrame(loop);
  }

  function start() {
    $('title').hidden = true; $('over').hidden = true;
    reset(); running = true;
    showBanner('1단계', THEMES[0].name);
    beep(520, .1, 'square', .05, 2);
  }
  function end() {
    running = false; holding = false;
    const isBest = seeds > best;
    if (isBest) { best = seeds; store.set(best); }
    $('final').textContent = seeds;
    $('stats').textContent = `${stage}단계 도달 · 보스 ${bossKills}마리 · 비행 ${Math.round(dist / S() / 10)}m`;
    $('verdict').textContent =
      bossKills >= 3 ? '하늘의 햄찌 대장 👑' : bossKills >= 1 ? '보스 잡은 용감한 햄찌' :
      seeds >= 150 ? '볼이 빵빵하다' : seeds >= 60 ? '오늘 간식은 넉넉' : '아직 볼이 홀쭉하다';
    $('best2').textContent = isBest ? '새 최고 기록!' : `최고 기록 · 씨앗 ${best}개`;
    drawIcon('icon2', Math.min(1, seeds / 200));
    $('over').hidden = false; showBest();
    beep(400, .35, 'triangle', .07, .5);
  }

  // 테스트용 훅: __hamster.startAt(n) 으로 n단계부터 시작
  function startAt(n) {
    start();
    while (stage < n) { nextStage(); }
    lives = 3; prevTheme = null; themeFade = 1; banner = null; stageT = 0; updateHud();
  }
  window.__hamster = { startAt, get state() { return { stage, phase, lives, seeds, hy: ham.y, boss: boss && { type: boss.type, hp: boss.hp, y: boss.y } }; }, forceBoss() { stageT = STAGE_LEN; } };

  $('start').onclick = start;
  $('again').onclick = start;
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
