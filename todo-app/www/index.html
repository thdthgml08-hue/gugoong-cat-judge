<!doctype html>
<html lang="ko" data-skin="pink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fdf0f3" id="theme-color">
<script>
  // 고른 테마를 그리기 전에 적용 (처음엔 핑크)
  try { document.documentElement.dataset.skin = localStorage.getItem("today-check:skin") || "pink"; } catch {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 체크">
<title>오늘의 체크</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Layout: one narrow column like a paper checklist — date + progress on top, input, list, filters at the foot */
:root {
  --bg: #eef2ef;
  --paper: #ffffff;
  --ink: #1d2a26;
  --muted: #66766f;
  --line: #d8e0dc;
  --accent: #2f7a62;
  --accent-soft: #dcece5;
  --danger: #b4473a;
  --bot-body: #fbfdfc;
  --bot-line: #2f7a62;
  --bot-screen: #1d2a26;
  --bot-glow: #7fe3bf;
  --bot-cheek: #f4a7b9;
  --bubble: #1d2a26;
  --bubble-ink: #ffffff;
  --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
/* 테마 4종: sage(세이지) · pink(말랑 핑크, 기본) · diary(다이어리 노트) · night(밤하늘) */
:root[data-skin="pink"] {
  --bg: #fdf0f3; --paper: #ffffff; --ink: #3a2530; --muted: #8a6f7b; --line: #f3d9e1;
  --accent: #e46a92; --accent-soft: #fde1ea; --danger: #c0392b;
  --bot-body: #ffffff; --bot-line: #e46a92; --bot-screen: #3a2530; --bot-glow: #ffd2e1; --bot-cheek: #ff9fbd;
  --bubble: #e46a92; --bubble-ink: #ffffff;
}
:root[data-skin="diary"] {
  --bg: #f6f1e4; --paper: #fffdf6; --ink: #2e2a22; --muted: #7c7465; --line: #e6dcc6;
  --accent: #3f6db3; --accent-soft: #fff1a8; --danger: #b4473a;
  --bot-body: #fffdf6; --bot-line: #3f6db3; --bot-screen: #2e2a22; --bot-glow: #ffe066; --bot-cheek: #ff9e9e;
  --bubble: #3f6db3; --bubble-ink: #ffffff; --marker: #fff1a8;
}
:root[data-skin="night"] {
  --bg: #141a33; --paper: #1d2546; --ink: #eef0ff; --muted: #9aa3cf; --line: #2c3663;
  --accent: #ffd36b; --accent-soft: #2e3870; --danger: #ff8f8f;
  --bot-body: #eef0ff; --bot-line: #ffd36b; --bot-screen: #0d1228; --bot-glow: #ffd36b; --bot-cheek: #ff9fbd;
  --bubble: #ffd36b; --bubble-ink: #141a33;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-skin="pink"] {
    --bg: #22161b; --paper: #2d1d24; --ink: #fbe9ef; --muted: #c49aac; --line: #4a2f3a;
    --accent: #ff8fb3; --accent-soft: #4a2433; --danger: #ff8f8f;
    --bot-body: #fbe9ef; --bot-line: #ff8fb3; --bot-screen: #22161b; --bot-glow: #ffc2d6;
    --bubble: #ff8fb3; --bubble-ink: #22161b;
    color-scheme: dark;
  }
  :root[data-skin="diary"] {
    --bg: #1e1b15; --paper: #27231b; --ink: #f1eadb; --muted: #b3a88f; --line: #3d3628;
    --accent: #8fb2ff; --accent-soft: #4d4420; --danger: #e48b7f;
    --bot-body: #f1eadb; --bot-line: #8fb2ff; --bot-screen: #1e1b15;
    --bubble: #8fb2ff; --bubble-ink: #1e1b15; --marker: #6b5d1f;
    color-scheme: dark;
  }
  :root[data-skin="sage"] {
    --bg: #131a18; --paper: #1b2421; --ink: #e6eeea; --muted: #94a59e;
    --line: #2c3934; --accent: #6cc4a4; --accent-soft: #1f3a31; --danger: #e48b7f;
    --bot-body: #e9f2ee; --bot-line: #6cc4a4; --bot-screen: #0f1513; --bot-glow: #8ff0cc; --bot-cheek: #f4a7b9;
    --bubble: #e6eeea; --bubble-ink: #131a18;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-top: calc(env(safe-area-inset-top, 0px) + 24px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.date { color: var(--muted); font-size: 13px; letter-spacing: .02em; }
h1 { font-weight: 800; font-size: 30px; line-height: 1.15; margin: 2px 0 0; letter-spacing: -.02em; }
.ring { position: relative; width: 64px; height: 64px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); transition: stroke-dashoffset .4s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }

form { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--line); }
#new-task {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: transparent;
  border: 0; padding: 10px 8px; outline: none; -webkit-user-select: text; user-select: text;
}
#new-task::placeholder { color: var(--muted); }
.add {
  font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 0 18px;
  background: var(--accent); color: var(--paper); cursor: pointer;
}
.add:disabled { opacity: .4; cursor: default; }

ul { list-style: none; margin: 0; padding: 0; }
li {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px;
  border-bottom: 1px solid var(--line);
  animation: pop .18s ease;
}
li:last-child { border-bottom: 0; }
@keyframes pop { from { transform: translateY(-3px); opacity: .5; } }
.check {
  flex: none; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; padding: 0;
  border: 2px solid var(--line); background: transparent; display: grid; place-items: center;
  transition: background .15s, border-color .15s;
}
.check svg { width: 16px; height: 16px; stroke: var(--paper); stroke-width: 3; fill: none; opacity: 0; }
li.done .check { background: var(--accent); border-color: var(--accent); }
li.done .check svg { opacity: 1; }
.text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
li.done .text { color: var(--muted); text-decoration: line-through; }
.edit { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 4px 8px; outline: none; -webkit-user-select: text; user-select: text; }
.del {
  flex: none; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  width: 36px; height: 36px; border-radius: 10px; font-size: 20px; line-height: 1; opacity: .6;
}
.del:active, .del:focus-visible { opacity: 1; color: var(--danger); background: var(--accent-soft); }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 4px; }

footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.filters { display: flex; gap: 4px; }
.filters button, .clear {
  font: inherit; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  padding: 6px 12px; border-radius: 999px;
}
.filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.clear:active { color: var(--danger); }
.count { font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
/* AI 친구 '삐익이' */
.head-right { display: flex; align-items: center; gap: 8px; }
/* 테마별 모양 */
[data-skin="pink"] .check { border-radius: 50%; }
[data-skin="pink"] .card { border-radius: 24px; }
[data-skin="diary"] .card { border-radius: 6px; }
[data-skin="diary"] li { border-bottom-style: dashed; }
[data-skin="diary"] li.done .text { text-decoration: none; color: var(--ink); background: linear-gradient(transparent 55%, var(--marker) 55%); }
[data-skin="night"] body {
  background-image: radial-gradient(1.5px 1.5px at 12% 8%, #fff8 50%, transparent), radial-gradient(1.5px 1.5px at 78% 14%, #fff8 50%, transparent),
    radial-gradient(1px 1px at 40% 92%, #fff6 50%, transparent), radial-gradient(1.5px 1.5px at 90% 70%, #fff6 50%, transparent),
    radial-gradient(1px 1px at 20% 60%, #fff5 50%, transparent), radial-gradient(1px 1px at 62% 40%, #fff4 50%, transparent);
  background-attachment: fixed;
}
[data-skin="night"] li.done .check svg { stroke: var(--bg); }

/* 테마 고르기 */
.skins { display: flex; gap: 8px; justify-content: space-between; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.skins button {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
  font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 0; border-radius: 12px; padding: 8px 2px; cursor: pointer;
}
.skins button[aria-pressed="true"] { color: var(--ink); font-weight: 700; background: var(--accent-soft); }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(0,0,0,.08); }

.sound { border: 1px solid var(--line); background: var(--paper); color: var(--muted); width: 36px; height: 36px; border-radius: 12px; font-size: 16px; cursor: pointer; padding: 0; }
.bot .body, .bot .head, .bot .ear, .bot .hand { fill: var(--bot-body); stroke: var(--bot-line); stroke-width: 3; }
.bot .arm, .bot .stick { stroke: var(--bot-line); stroke-width: 3; stroke-linecap: round; fill: none; }
.bot .screen { fill: var(--bot-screen); }
.bot .face { stroke: var(--bot-glow); stroke-width: 3.5; stroke-linecap: round; fill: none; }
.bot .cheek { fill: var(--bot-cheek); opacity: .85; }
.bot .bulb { fill: var(--bot-cheek); }
.bot .heart { fill: var(--bot-cheek); }
#buddy {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 20;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transform: translate(-50%, 0); pointer-events: none;
}
#buddy.show { animation: buddy-in 1.8s cubic-bezier(.2,.9,.3,1.2) both; }
#buddy .bot { width: 96px; height: 112px; }
#buddy.show .bot { animation: wiggle .5s ease-in-out .35s 2; }
#buddy.show .bulb { animation: blink .3s steps(2) .2s 5; }
.bubble {
  position: relative; background: var(--bubble); color: var(--bubble-ink);
  padding: 8px 16px; border-radius: 16px; font-weight: 800; font-size: 20px; white-space: nowrap;
  box-shadow: 0 6px 18px rgba(0,0,0,.18);
}
.bubble small { display: block; text-align: center; font-size: 12px; font-weight: 700; opacity: .75; letter-spacing: .08em; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
@keyframes buddy-in {
  0% { transform: translate(-50%, 140%); opacity: 0; }
  18% { transform: translate(-50%, -6%); opacity: 1; }
  26%, 82% { transform: translate(-50%, 0); opacity: 1; }
  100% { transform: translate(-50%, 140%); opacity: 0; }
}

.bot .face-wow, .bot .face-sad, .bot .acc { display: none; }
.bot[data-face="wow"] .face-wow, .bot[data-face="sad"] .face-sad { display: inline; }
.bot[data-face="wow"] .face-happy, .bot[data-face="sad"] .face-happy { display: none; }
.bot[data-face="sad"] .cheek { opacity: .3; }
.bot .tear { fill: #8ccfff; stroke: none; }
.bot.has-2 .acc-2, .bot.has-3 .acc-3, .bot.has-4 .acc-4, .bot.has-5 .acc-5 { display: inline; }
.bot.has-2 .bulb { display: none; }
.bot .petal { fill: var(--bot-cheek); }
.bot .pistil { fill: #ffd36b; }
.bot .bow { fill: var(--bot-cheek); stroke: var(--bot-line); stroke-width: 2; stroke-linejoin: round; }
.bot .bow-knot { fill: var(--bot-line); }
.bot .wing { fill: var(--bot-glow); stroke: var(--bot-line); stroke-width: 2.5; stroke-linejoin: round; opacity: .9; }
.bot .crown { fill: #ffd36b; stroke: var(--bot-line); stroke-width: 2.5; stroke-linejoin: round; }

/* 삐익이 카드: 레벨 · 경험치 · 연속 기록 */
.pal { display: flex; align-items: center; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 12px 16px; }
.pal .bot { width: 64px; height: 75px; flex: none; }
.pal-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pal-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pal-top b { font-size: 16px; }
.lv { font-size: 12px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.streak { font-size: 13px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.streak.off { color: var(--muted); font-weight: 500; }
.xpbar { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.xpbar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .5s ease; }
.pal-msg { margin: 0; font-size: 13px; color: var(--ink); line-height: 1.4; }
.pal-next { margin: 0; font-size: 12px; color: var(--muted); }
.pal.risk { border-color: var(--bot-cheek); }
#buddy.show.wow { animation: buddy-in-long 3.4s cubic-bezier(.2,.9,.3,1.2) both; }
#buddy.show.wow .bot { animation: hop .42s ease-in-out .5s 5; }
#buddy.show.wow .bulb { animation: blink .25s steps(2) .2s 12; }
@keyframes buddy-in-long {
  0% { transform: translate(-50%, 140%); opacity: 0; }
  10% { transform: translate(-50%, -6%); opacity: 1; }
  14%, 90% { transform: translate(-50%, 0); opacity: 1; }
  100% { transform: translate(-50%, 140%); opacity: 0; }
}
@keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-18px) rotate(-4deg); } 55% { transform: translateY(-18px) rotate(4deg); } }
.confetti { position: fixed; z-index: 19; pointer-events: none; font-size: 20px; line-height: 1; left: 0; top: 0;
  animation: pop-out 1.6s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes pop-out {
  0% { transform: translate(var(--x0), var(--y0)) scale(.4) rotate(0); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(var(--x1), var(--y1)) scale(1) rotate(var(--r)); opacity: 0; }
}
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
@keyframes blink { to { opacity: .2; } }
@media (prefers-reduced-motion: reduce) {
  #buddy.show, #buddy.show.wow { animation: buddy-fade 1.8s both; }
  #buddy.show.wow { animation-duration: 3.4s; }
  #buddy.show .bot, #buddy.show .bulb, #buddy.show.wow .bot, #buddy.show.wow .bulb { animation: none; }
  .confetti { display: none; }
  @keyframes buddy-fade { 0%, 100% { opacity: 0; } 10%, 85% { opacity: 1; } }
}

@media (prefers-reduced-motion: reduce) { li { animation: none; } .ring .bar { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="date" id="date"></div>
      <h1 id="headline">오늘 할 일</h1>
    </div>
    <div class="head-right">
    <button type="button" class="sound" id="skin-btn" aria-label="테마 고르기" aria-expanded="false" aria-controls="skins">🎨</button>
    <button type="button" class="sound" id="sound" aria-label="효과음 끄기">🔊</button>
    <div class="ring" role="img" aria-label="완료율">
      <svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="27" fill="none" stroke-width="6"/><circle class="bar" id="bar" cx="32" cy="32" r="27" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="169.65" stroke-dashoffset="169.65"/></svg>
      <span id="pct">0%</span>
    </div>
    </div>
  </header>

  <div class="skins" id="skins" role="group" aria-label="테마" hidden>
    <button type="button" data-skin="pink"><span class="swatch" style="background:linear-gradient(135deg,#fde1ea 50%,#e46a92 50%)"></span>말랑 핑크</button>
    <button type="button" data-skin="sage"><span class="swatch" style="background:linear-gradient(135deg,#eef2ef 50%,#2f7a62 50%)"></span>세이지</button>
    <button type="button" data-skin="diary"><span class="swatch" style="background:linear-gradient(135deg,#fff1a8 50%,#3f6db3 50%)"></span>다이어리</button>
    <button type="button" data-skin="night"><span class="swatch" style="background:linear-gradient(135deg,#141a33 50%,#ffd36b 50%)"></span>밤하늘</button>
  </div>

  <section class="pal" id="pal" aria-label="삐익이">
    <span id="pal-bot-slot"></span>
    <div class="pal-info">
      <div class="pal-top"><b>삐익이<span class="lv" id="pal-lv">Lv.1</span></b><span class="streak off" id="streak">🔥 0일</span></div>
      <div class="xpbar" role="progressbar" aria-label="다음 레벨까지" id="xpbar"><span id="xp-fill"></span></div>
      <p class="pal-msg" id="pal-msg"></p>
      <p class="pal-next" id="pal-next"></p>
    </div>
  </section>

  <div class="card">
    <form id="add-form" autocomplete="off">
      <input id="new-task" maxlength="200" placeholder="할 일을 적어 주세요" aria-label="새 할 일" enterkeyhint="done">
      <button class="add" id="add-btn" type="submit">추가</button>
    </form>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden></div>
    <footer>
      <span class="count" id="count"></span>
      <div class="filters" role="group" aria-label="보기">
        <button type="button" data-f="all" aria-pressed="true">전체</button>
        <button type="button" data-f="open" aria-pressed="false">남은 일</button>
        <button type="button" data-f="done" aria-pressed="false">완료</button>
      </div>
      <button type="button" class="clear" id="clear" hidden>완료 지우기</button>
    </footer>
  </div>
  <p class="hint">글자를 길게 누르거나 두 번 누르면 고칠 수 있어요.</p>
</div>
<div id="buddy" hidden aria-live="polite">
  <div class="bubble"><span id="buddy-say">장하다!!!</span><small id="buddy-sub">삐익!</small></div>
  <svg class="bot" id="buddy-bot" viewBox="0 0 120 140" aria-hidden="true">
    <g class="acc acc-4"><path class="wing" d="M40 104 q-34 -16 -30 12 q14 6 30 -4 z M80 104 q34 -16 30 12 q-14 6 -30 -4 z"/></g>
    <line class="stick" x1="60" y1="24" x2="60" y2="10"/>
    <circle class="bulb" cx="60" cy="8" r="6"/>
    <g class="acc acc-2"><circle class="petal" cx="60" cy="2" r="4"/><circle class="petal" cx="66" cy="7" r="4"/><circle class="petal" cx="63.5" cy="13.5" r="4"/><circle class="petal" cx="56.5" cy="13.5" r="4"/><circle class="petal" cx="54" cy="7" r="4"/><circle class="pistil" cx="60" cy="8" r="3.2"/></g>
    <rect class="ear" x="8" y="44" width="12" height="22" rx="5"/>
    <rect class="ear" x="100" y="44" width="12" height="22" rx="5"/>
    <rect class="head" x="18" y="24" width="84" height="64" rx="24"/>
    <rect class="screen" x="28" y="35" width="64" height="42" rx="15"/>
    <path class="face face-happy" d="M40 58 q6 -9 12 0 M68 58 q6 -9 12 0 M53 66 q7 6 14 0"/>
    <g class="face face-wow"><circle cx="45" cy="53" r="5.5"/><circle cx="75" cy="53" r="5.5"/><path d="M54 61 v10 h12 v-10 M54 66 h12"/></g>
    <g class="face face-sad"><path d="M40 53 l11 4 M80 53 l-11 4 M53 71 q7 -7 14 0"/><path class="tear" d="M44 62 q-3 5 0 7 q3 -2 0 -7 z"/></g>
    <ellipse class="cheek" cx="38" cy="68" rx="5" ry="3"/>
    <ellipse class="cheek" cx="82" cy="68" rx="5" ry="3"/>
    <path class="arm" d="M40 100 L22 80 M80 100 L98 80"/>
    <circle class="hand" cx="20" cy="77" r="6"/>
    <circle class="hand" cx="100" cy="77" r="6"/>
    <rect class="body" x="38" y="90" width="44" height="38" rx="15"/>
    <path class="heart" d="M60 118 l-8 -8 a4.5 4.5 0 0 1 8 -5 a4.5 4.5 0 0 1 8 5 z"/>
    <g class="acc acc-3"><path class="bow" d="M60 93 l-11 -6 v12 z M60 93 l11 -6 v12 z"/><circle class="bow-knot" cx="60" cy="93" r="3"/></g>
    <g class="acc acc-5"><path class="crown" d="M44 31 l3 -12 l7 6 l6 -9 l6 9 l7 -6 l3 12 z"/></g>
  </svg>
</div>


<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = "today-check:v1";
  const FKEY = "today-check:filter";
  let todos = load();
  let filter = "all";
  try { filter = localStorage.getItem(FKEY) || "all"; } catch {}

  function load() { try { const v = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {} }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function setDate() {
    $("date").textContent = new Date().toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
  }

  function render() {
    const shown = todos.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
    $("list").replaceChildren(...shown.map(row));
    const total = todos.length, done = todos.filter(t => t.done).length, left = total - done;
    const empty = $("empty");
    empty.hidden = shown.length > 0;
    if (!shown.length) {
      empty.innerHTML = total === 0
        ? "<b>아직 할 일이 없어요</b>위 칸에 첫 할 일을 적어 보세요."
        : filter === "done" ? "<b>완료한 일이 아직 없어요</b>하나씩 체크해 봐요."
        : "<b>다 끝냈어요!</b>오늘 수고 많았어요.";
    }
    $("count").textContent = total ? `남은 일 ${left}개 · 완료 ${done}개` : "";
    $("clear").hidden = done === 0;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("pct").textContent = pct + "%";
    $("bar").style.strokeDashoffset = 169.65 * (1 - pct / 100);
    $("headline").textContent = total && left === 0 ? "오늘 할 일 끝!" : "오늘 할 일";
    document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === filter));
    paintPal();
  }

  function row(t) {
    const li = document.createElement("li");
    if (t.done) li.className = "done";
    const chk = document.createElement("button");
    chk.className = "check"; chk.type = "button";
    chk.setAttribute("aria-label", t.done ? "완료 취소" : "완료로 표시");
    chk.setAttribute("aria-pressed", t.done);
    chk.innerHTML = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
    chk.onclick = () => {
      t.done = !t.done;
      if (navigator.vibrate) navigator.vibrate(10);
      let levelUp = 0;
      if (t.done && !t.earned) {
        // 할 일 하나당 경험치는 한 번만 (체크를 껐다 켰다 해도 더 안 쌓임)
        t.earned = true;
        const before = levelOf(pal.xp);
        pal.xp += 1;
        if (levelOf(pal.xp) > before) levelUp = levelOf(pal.xp);
      }
      const allDone = t.done && todos.every(x => x.done);
      if (allDone) markAllDone();
      save(); savePal(); render();
      if (t.done) cheer({ text: t.text, allDone, levelUp });
    };

    const txt = document.createElement("span");
    txt.className = "text"; txt.textContent = t.text;
    txt.ondblclick = () => startEdit(txt, t);
    let press;
    txt.addEventListener("touchstart", () => { press = setTimeout(() => startEdit(txt, t), 500); }, { passive: true });
    ["touchend", "touchmove", "touchcancel"].forEach(ev => txt.addEventListener(ev, () => clearTimeout(press), { passive: true }));

    const del = document.createElement("button");
    del.className = "del"; del.type = "button"; del.textContent = "×";
    del.setAttribute("aria-label", `"${t.text}" 삭제`);
    del.onclick = () => { todos = todos.filter(x => x !== t); save(); render(); };

    li.append(chk, txt, del);
    return li;
  }

  function startEdit(txt, t) {
    if (!txt.isConnected) return;
    const inp = document.createElement("input");
    inp.className = "edit"; inp.value = t.text; inp.maxLength = 200; inp.enterKeyHint = "done";
    txt.replaceWith(inp); inp.focus(); inp.select();
    let finished = false;
    const finish = keep => {
      if (finished) return; finished = true;
      const v = inp.value.trim();
      if (keep && v && v !== t.text) { t.text = v; save(); }
      render();
    };
    inp.onkeydown = e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
    inp.onblur = () => finish(true);
  }

  const input = $("new-task");
  $("add-form").onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    todos.push({ id: uid(), text, done: false, createdAt: Date.now() });
    save();
    input.value = "";
    if (filter === "done") filter = "all";
    render(); input.focus();
  };
  document.querySelectorAll(".filters button").forEach(b => b.onclick = () => {
    filter = b.dataset.f;
    try { localStorage.setItem(FKEY, filter); } catch {}
    render();
  });
  $("clear").onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };

  // 날짜가 바뀐 채로 앱을 다시 열면 날짜 줄을 새로 그림
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { setDate(); paintPal(); } });


  // ---- AI 친구 '삐익이': 체크하면 튀어나와 칭찬 + 삐익 효과음 ----
  const SKEY = "today-check:sound";
  let soundOn = true;
  try { soundOn = localStorage.getItem(SKEY) !== "off"; } catch {}
  let audio = null;

  // ---- 삐익이 키우기 · 연속 기록 ----
  const PKEY = "today-check:pal";
  const LEVELS = [ // [필요한 완료 수, 생기는 것]
    [0, ""], [5, "안테나에 꽃이 피었어"], [15, "리본을 맸어"], [30, "날개가 생겼어"], [50, "왕관을 썼어"],
  ];
  let pal = { xp: 0, streak: 0, best: 0, last: "" };
  try { pal = { ...pal, ...JSON.parse(localStorage.getItem(PKEY) || "{}") }; } catch {}
  function savePal() { try { localStorage.setItem(PKEY, JSON.stringify(pal)); } catch {} }
  const levelOf = xp => LEVELS.reduce((lv, [need], i) => (xp >= need ? i + 1 : lv), 1);
  const ymd = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const today = () => ymd(new Date());
  const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); };
  const liveStreak = () => (pal.last === today() || pal.last === yesterday() ? pal.streak : 0);

  function markAllDone() {
    if (pal.last === today()) return;
    pal.streak = pal.last === yesterday() ? pal.streak + 1 : 1;
    pal.best = Math.max(pal.best, pal.streak);
    pal.last = today();
  }

  function dressBot(svg, face) {
    const lv = levelOf(pal.xp);
    for (let n = 2; n <= 5; n++) svg.classList.toggle("has-" + n, lv >= n);
    svg.dataset.face = face;
  }

  function paintPal() {
    const lv = levelOf(pal.xp);
    const next = LEVELS[lv];
    const floor = LEVELS[lv - 1][0];
    const streak = liveStreak();
    const total = todos.length, left = todos.filter(t => !t.done).length;
    const doneToday = pal.last === today();
    const risk = !doneToday && pal.last === yesterday() && pal.streak > 0;

    $("pal-lv").textContent = "Lv." + lv;
    $("streak").textContent = streak ? `🔥 ${streak}일 연속` : "🔥 0일";
    $("streak").classList.toggle("off", !streak);
    const pct = next ? Math.round((pal.xp - floor) / (next[0] - floor) * 100) : 100;
    $("xp-fill").style.width = pct + "%";
    $("xpbar").setAttribute("aria-valuenow", pct);
    $("pal-next").textContent = next
      ? `${next[0] - pal.xp}개 더 끝내면 Lv.${lv + 1}: ${next[1]}`
      : `최고 레벨! 지금까지 ${pal.xp}개 끝냈어 · 최고 연속 ${pal.best}일`;

    let msg, face = "happy";
    if (doneToday && total && left === 0) msg = "오늘 다 끝냈어! 최고야 💗";
    else if (risk) { msg = `${pal.streak}일 기록이 끊기려고 해… 오늘도 다 끝내 줘 삐익 🥺`; face = "sad"; }
    else if (!total) msg = "할 일을 적어 주면 옆에서 응원할게!";
    else msg = `남은 일 ${left}개, 같이 하자 삐익!`;
    $("pal-msg").textContent = msg;
    $("pal").classList.toggle("risk", risk);
    dressBot($("pal-bot"), face);
  }

  // ---- 상황에 맞는 칭찬 ----
  const TOPICS = [
    [/운동|헬스|러닝|달리기|요가|필라테스|산책|스쿼트|걷기|수영/, "근육 삐익! 💪"],
    [/물|수분/, "촉촉해졌다 삐익! 💧"],
    [/공부|과제|숙제|책|읽기|시험|강의|복습/, "똑똑해졌다 삐익! 📚"],
    [/청소|빨래|설거지|정리|분리수거/, "반짝반짝 삐익! ✨"],
    [/장보기|장 보기|마트|쇼핑/, "장 봤다니 장하다! 🛒"],
    [/약|영양제|비타민/, "건강 충전 삐익! 💊"],
    [/잠|수면|일찍 자/, "꿀잠 예약 삐익! 😴"],
    [/밥|식사|요리|도시락/, "든든하다 삐익! 🍚"],
    [/메일|연락|전화|답장|문자/, "소통왕 삐익! 📮"],
  ];
  function praiseFor(text) {
    const h = new Date().getHours();
    const say = h >= 5 && h < 11 ? "아침부터 장하다!!!" : (h >= 22 || h < 5) ? "이 밤에도 장하다!!!" : "장하다!!!";
    const topic = TOPICS.find(([re]) => re.test(text));
    return [say, topic ? topic[1] : "삐익!"];
  }

  function paintSound() {
    $("sound").textContent = soundOn ? "🔊" : "🔇";
    $("sound").setAttribute("aria-label", soundOn ? "효과음 끄기" : "효과음 켜기");
  }
  $("sound").onclick = () => {
    soundOn = !soundOn;
    try { localStorage.setItem(SKEY, soundOn ? "on" : "off"); } catch {}
    paintSound();
    if (soundOn) beep([[880, 0, .08]]);
  };

  // 음 [주파수, 시작(초), 길이(초)] 목록을 짧은 로봇 소리로 재생
  function beep(notes) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      const now = audio.currentTime;
      for (const [freq, at, len, to] of notes) {
        const osc = audio.createOscillator(), gain = audio.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(freq, now + at);
        if (to) osc.frequency.exponentialRampToValueAtTime(to, now + at + len);
        gain.gain.setValueAtTime(0.0001, now + at);
        gain.gain.exponentialRampToValueAtTime(0.12, now + at + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + at + len);
        osc.connect(gain).connect(audio.destination);
        osc.start(now + at); osc.stop(now + at + len + 0.02);
      }
    } catch {}
  }

  let hideTimer;
  // 다 끝냈을 때: 삐익이 머리 위에서 하트·별 꽃가루가 팡
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const pieces = ["💗", "⭐", "✨", "💚", "🩷", "🌟"];
    const cx = innerWidth / 2, cy = innerHeight - 150;
    for (let i = 0; i < 28; i++) {
      const el = document.createElement("span");
      el.className = "confetti";
      el.textContent = pieces[i % pieces.length];
      const angle = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.3;
      const dist = 120 + Math.random() * 180;
      el.style.setProperty("--x0", cx - 10 + "px");
      el.style.setProperty("--y0", cy + "px");
      el.style.setProperty("--x1", cx - 10 + Math.cos(angle) * dist + "px");
      el.style.setProperty("--y1", cy + Math.sin(angle) * dist + 60 + "px");
      el.style.setProperty("--r", (Math.random() * 360 - 180) + "deg");
      el.style.animationDelay = (Math.random() * .25) + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }
  }
  function cheer({ text, allDone, levelUp }) {
    const buddy = $("buddy");
    const big = allDone || levelUp > 0;
    let say, sub;
    if (levelUp) { say = "레벨 업!!!"; sub = `Lv.${levelUp} ${LEVELS[levelUp - 1][1]}! 삐삐빅!`; }
    else if (allDone) { say = "다 끝냈다!!!"; sub = pal.streak > 1 ? `🔥 ${pal.streak}일 연속! 삐빅 삐빅!` : "삐빅 삐빅! 오늘 최고!"; }
    else [say, sub] = praiseFor(text);
    $("buddy-say").textContent = say;
    $("buddy-sub").textContent = sub;
    dressBot($("buddy-bot"), big ? "wow" : "happy");
    buddy.hidden = false;
    buddy.classList.remove("show", "wow"); void buddy.offsetWidth;
    buddy.classList.add("show");
    buddy.classList.toggle("wow", big);
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { buddy.hidden = true; buddy.classList.remove("show", "wow"); }, big ? 3450 : 1850);
    if (big) confetti();
    // 삐- 익! (짧은 음 하나 + 위로 올라가는 음) · 레벨 업은 다섯 음
    beep(levelUp
      ? [[784, 0, .08], [988, .1, .08], [1175, .2, .08], [1568, .3, .08], [2093, .42, .3, 3136]]
      : allDone
      ? [[988, 0, .09], [1319, .11, .09], [1568, .22, .09], [2093, .33, .22, 2637]]
      : [[1047, 0, .09], [1175, .12, .2, 1976]]);
  }
  paintSound();

  // ---- 테마 고르기 ----
  const SKIN_KEY = "today-check:skin";
  function applySkin(name) {
    document.documentElement.dataset.skin = name;
    document.querySelectorAll(".skins button").forEach(b => b.setAttribute("aria-pressed", b.dataset.skin === name));
    $("theme-color").content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  }
  $("skin-btn").onclick = () => {
    const panel = $("skins");
    panel.hidden = !panel.hidden;
    $("skin-btn").setAttribute("aria-expanded", !panel.hidden);
  };
  document.querySelectorAll(".skins button").forEach(b => b.onclick = () => {
    applySkin(b.dataset.skin);
    try { localStorage.setItem(SKIN_KEY, b.dataset.skin); } catch {}
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => applySkin(document.documentElement.dataset.skin));
  applySkin(document.documentElement.dataset.skin || "pink");

  const palBot = $("buddy-bot").cloneNode(true);
  palBot.id = "pal-bot";
  $("pal-bot-slot").replaceWith(palBot);

  setDate();
  render();

  // 웹으로 열었을 때만 오프라인용 서비스 워커 등록 (네이티브 앱은 파일이 이미 기기 안에 있음)
  if ("serviceWorker" in navigator && location.protocol === "https:" && !window.Capacitor?.isNativePlatform?.()) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
